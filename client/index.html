    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is AI transformation and why is it important for organizations?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "AI transformation is the strategic process of integrating artificial intelligence technologies across an organization to fundamentally change how it operates, delivers value, and competes. Eclectik measures whether that change is actually happening, in the P&L and in how people do their work, by combining objective telemetry with employee listening data. Cohorts are named in advance, one outcome definition holds throughout, and the estimator is chosen up front, so the finding survives review."
          }
        },
        {
          "@type": "Question",
          "name": "What services does Eclectik provide for AI transformation?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Eclectik provides independent AI transformation assurance. Proof of Value models ROI, TCO and adoption economics on the organisation\u2019s own licence, usage and telemetry data, for CFOs and CIOs. Proof of Change is a people-science reading of listening data, whatever instrument the organisation runs, for transformation leaders. Eclectik also runs Customer Success and People Science for organisations on Viva Glint and on Workvivo Seer, independently of the platform vendor. Partners deliver the transformation; Eclectik proves whether it works."
          }
        },
        {
          "@type": "Question",
          "name": "What are Workplace Signals and how do they help with AI adoption?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Workplace Signals are data points that Eclectik collects and analyzes to understand organizational readiness, employee sentiment, and adoption patterns during AI transformation. By combining objective telemetry (usage metrics, productivity data) with subjective sentiment (employee feedback, change readiness), we build actionable roadmaps that deliver measurable impact."
          }
        },
        {
          "@type": "Question",
          "name": "What is the Eclectik VIA™ Framework?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The Eclectik VIA™ Framework is Eclectik's proprietary methodology for AI transformation that stands for Vision, Implementation, and Acceleration. It operationalizes Workplace Signals end-to-end by combining objective telemetry with subjective sentiment to create AI-native, people-centered organizations."
          }
        },
        {
          "@type": "Question",
          "name": "What results can organizations expect from working with Eclectik?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Organizations working with Eclectik typically achieve: 40-60% improvement in AI adoption rates, 30-50% increase in employee productivity through AI tools, measurable ROI within 6-12 months, enhanced change readiness scores, improved employee experience metrics, and sustainable AI-native organizational capabilities."
          }
        },
        {
          "@type": "Question",
          "name": "How do I get started with Eclectik's AI transformation services?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Getting started with Eclectik is simple: Contact us through our website to schedule an initial consultation. We'll assess your organization's AI readiness, discuss your transformation goals, and design a customized roadmap using our Eclectik VIA™ Framework. As a boutique consultancy, we provide personalized attention from day one."
          }
        }
